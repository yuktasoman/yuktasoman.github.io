<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Borgward cross-functional project delivery overview</title>
  <desc id="desc">A non-confidential portfolio reconstruction summarising Yukta Soman's real delivery coordination responsibilities at Borgward Group.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111329"/>
      <stop offset="1" stop-color="#080914"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b6cff"/>
      <stop offset="1" stop-color="#68d8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1460" cy="80" r="310" fill="#7c4dff" opacity=".10"/>
  <circle cx="120" cy="820" r="260" fill="#36bff5" opacity=".07"/>

  <text x="92" y="92" fill="#b796ff" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">BORGWARD GROUP · PORTFOLIO EVIDENCE</text>
  <text x="92" y="154" fill="#f5f4ff" font-family="Arial, sans-serif" font-size="52" font-weight="700">Cross-Functional Project Delivery</text>
  <text x="92" y="198" fill="#a6a5bd" font-family="Arial, sans-serif" font-size="23">Brand Development Manager · Dec 2022–Mar 2024 · Reported directly to the Director</text>
  <rect x="1180" y="90" width="328" height="62" rx="31" fill="#1c1e39" stroke="#9b6cff" stroke-opacity=".55"/>
  <text x="1344" y="129" text-anchor="middle" fill="#d8caff" font-family="Arial, sans-serif" font-size="19" font-weight="700">NON-CONFIDENTIAL RECONSTRUCTION</text>

  <g filter="url(#shadow)">
    <rect x="92" y="252" width="330" height="154" rx="22" fill="#17192f" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="450" y="252" width="330" height="154" rx="22" fill="#17192f" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="808" y="252" width="330" height="154" rx="22" fill="#17192f" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="1166" y="252" width="342" height="154" rx="22" fill="#17192f" stroke="#ffffff" stroke-opacity=".12"/>
  </g>
  <text x="124" y="300" fill="#a6a5bd" font-family="Arial, sans-serif" font-size="20">PROJECT PORTFOLIO</text>
  <text x="124" y="355" fill="#f5f4ff" font-family="Arial, sans-serif" font-size="50" font-weight="700">30+</text>
  <text x="124" y="386" fill="#c8c5da" font-family="Arial, sans-serif" font-size="19">client-facing projects</text>
  <text x="482" y="300" fill="#a6a5bd" font-family="Arial, sans-serif" font-size="20">CROSS-FUNCTIONAL TEAM</text>
  <text x="482" y="355" fill="#f5f4ff" font-family="Arial, sans-serif" font-size="50" font-weight="700">32</text>
  <text x="482" y="386" fill="#c8c5da" font-family="Arial, sans-serif" font-size="19">team members</text>
  <text x="840" y="300" fill="#a6a5bd" font-family="Arial, sans-serif" font-size="20">DELIVERY DISCIPLINES</text>
  <text x="840" y="355" fill="#f5f4ff" font-family="Arial, sans-serif" font-size="50" font-weight="700">6</text>
  <text x="840" y="386" fill="#c8c5da" font-family="Arial, sans-serif" font-size="19">connected workstreams</text>
  <text x="1198" y="300" fill="#a6a5bd" font-family="Arial, sans-serif" font-size="20">LEADERSHIP LINK</text>
  <text x="1198" y="353" fill="#f5f4ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Direct reporting</text>
  <text x="1198" y="382" fill="#c8c5da" font-family="Arial, sans-serif" font-size="21">to the Director</text>

  <rect x="92" y="454" width="930" height="354" rx="24" fill="#13152a" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="130" y="510" fill="#f5f4ff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Representative delivery flow</text>
  <text x="130" y="544" fill="#9997ad" font-family="Arial, sans-serif" font-size="19">How work moved from a client need to a reviewed deliverable</text>

  <line x1="195" y1="638" x2="900" y2="638" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="195" cy="638" r="30" fill="#9b6cff"/><text x="195" y="646" fill="#fff" font-size="21" font-weight="700">1</text>
    <circle cx="372" cy="638" r="30" fill="#8b75ff"/><text x="372" y="646" fill="#fff" font-size="21" font-weight="700">2</text>
    <circle cx="548" cy="638" r="30" fill="#778dff"/><text x="548" y="646" fill="#fff" font-size="21" font-weight="700">3</text>
    <circle cx="724" cy="638" r="30" fill="#69b3ff"/><text x="724" y="646" fill="#fff" font-size="21" font-weight="700">4</text>
    <circle cx="900" cy="638" r="30" fill="#68d8ff"/><text x="900" y="646" fill="#07111a" font-size="21" font-weight="700">5</text>
    <text x="195" y="697" fill="#e8e6f4" font-size="17" font-weight="700">Clarify</text><text x="195" y="718" fill="#e8e6f4" font-size="17" font-weight="700">brief</text>
    <text x="372" y="697" fill="#e8e6f4" font-size="17" font-weight="700">Plan &amp;</text><text x="372" y="718" fill="#e8e6f4" font-size="17" font-weight="700">allocate</text>
    <text x="548" y="697" fill="#e8e6f4" font-size="17" font-weight="700">Track</text><text x="548" y="718" fill="#e8e6f4" font-size="17" font-weight="700">dependencies</text>
    <text x="724" y="697" fill="#e8e6f4" font-size="17" font-weight="700">Review</text><text x="724" y="718" fill="#e8e6f4" font-size="17" font-weight="700">quality</text>
    <text x="900" y="697" fill="#e8e6f4" font-size="17" font-weight="700">Report &amp;</text><text x="900" y="718" fill="#e8e6f4" font-size="17" font-weight="700">close</text>
  </g>
  <text x="130" y="765" fill="#9997ad" font-family="Arial, sans-serif" font-size="19">Software · Websites · Digital · Creative · Mechanical · Civil</text>

  <rect x="1050" y="454" width="458" height="354" rx="24" fill="#13152a" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="1088" y="510" fill="#f5f4ff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Delivery controls used</text>
  <g font-family="Arial, sans-serif" font-size="21">
    <circle cx="1097" cy="568" r="6" fill="#9b6cff"/><text x="1120" y="575" fill="#c8c5da">Action and progress tracking</text>
    <circle cx="1097" cy="615" r="6" fill="#9b6cff"/><text x="1120" y="622" fill="#c8c5da">Client and team updates</text>
    <circle cx="1097" cy="662" r="6" fill="#9b6cff"/><text x="1120" y="669" fill="#c8c5da">Dependency coordination</text>
    <circle cx="1097" cy="709" r="6" fill="#68d8ff"/><text x="1120" y="716" fill="#c8c5da">Quality and output reviews</text>
    <circle cx="1097" cy="756" r="6" fill="#68d8ff"/><text x="1120" y="763" fill="#c8c5da">Recovery planning when at risk</text>
  </g>
  <rect x="92" y="846" width="1416" height="3" rx="2" fill="url(#accent)" opacity=".8"/>
</svg>
